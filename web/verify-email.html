<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Подтверждение почты — MatchLab</title>
    <link rel="stylesheet" href="/verification-assets/verify-email.css" />
    <script type="module" src="/verification-assets/verify-email.mjs"></script>
  </head>
  <body>
    <main class="card">
      <div class="brand">matchlab<span>.</span></div>
      <div class="icon" aria-hidden="true">✉</div>
      <h1>Подтвердите почту</h1>
      <p>Откройте ссылку в приложении MatchLab или подтвердите адрес здесь.</p>
      <p>Подтверждение произойдёт только после нажатия кнопки.</p>
      <div id="status" role="status" aria-live="polite"></div>
      <div class="actions">
        <button id="confirm" type="button" disabled>Подтвердить почту</button>
        <a id="open-app" class="secondary" hidden>Открыть в приложении</a>
      </div>
      <p class="hint">
        Если приложение не установлено, подтвердите адрес в браузере, затем войдите в MatchLab с
        почтой и паролем.
      </p>
      <noscript
        >Для подтверждения почты включите JavaScript или откройте ссылку в приложении
        MatchLab.</noscript
      >
    </main>
  </body>
</html>
