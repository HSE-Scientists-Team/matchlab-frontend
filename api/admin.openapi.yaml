  /api/v1/admin/auth/login:
    post:
      description: Separate staff login, no public registration. 12–72 byte passwords; five failures per
        normalized email per 15 minutes. Staff tokens expire after eight hours and are incompatible
        with user sessions.
      operationId: adminLoginPOST
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
              type: object
        required: true
