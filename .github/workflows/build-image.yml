name: Build frontend image
on:
  workflow_dispatch:
    inputs:
      propose_deploy:
        description: Create a deployment PR in matchlab-infra
        type: boolean
        required: true
        default: true
permissions:
  contents: read
concurrency:
  group: frontend-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  build:
    needs: test
    outputs:
      image: ${{ steps.name.outputs.image }}@${{ steps.image.outputs.digest }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "image=ghcr.io/${OWNER,,}/matchlab-services/frontend" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Check visibility and publish digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          visibility=$(gh api "orgs/$OWNER/packages/container/matchlab-services%2Ffrontend" --jq .visibility)
          test "$visibility" = private
          echo "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  propose-deploy:
    needs: [test, build]
    if: ${{ inputs.propose_deploy }}
    runs-on: ubuntu-latest
    concurrency:
      group: frontend-infra-release-proposals
      cancel-in-progress: false
    steps:
      - name: Check infra token
        env:
          INFRA_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: |
          if [ -z "$INFRA_TOKEN" ]; then
            echo "::error::Set INFRA_REPO_TOKEN with Contents and Pull requests read/write access to matchlab-infra."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          path: frontend
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - uses: actions/checkout@v5
        with:
          repository: HSE-Scientists-Team/matchlab-infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra
          persist-credentials: false
      - name: Update only the frontend digest
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: node frontend/scripts/update-infra-image.mjs infra/clusters/homelab/images.yaml "$IMAGE"
      - uses: peter-evans/create-pull-request@v7
        with:
          path: infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          branch: release/frontend-${{ github.sha }}
          title: 'Release frontend: ${{ github.sha }}'
          commit-message: 'Update frontend from ${{ github.sha }}'
          body: |
            Frontend checks passed and the private image was published in GHCR.
            Only FRONTEND_IMAGE changes; all backend versions remain unchanged.

            Source: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
            Build: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Flux deploys the image after this PR is merged. This workflow does not merge PRs.
          add-paths: clusters/homelab/images.yaml
